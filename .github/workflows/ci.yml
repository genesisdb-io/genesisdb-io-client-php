name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ["8.2", "8.3", "8.4"]
    services:
      genesisdb:
        image: genesisdb/genesisdb:latest
        env:
          GENESISDB_AUTH_TOKEN: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
        ports:
          - 8080:8080
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - run: composer install --no-interaction --no-progress
      - run: vendor/bin/phpunit --testsuite unit
      - run: vendor/bin/phpunit --testsuite integration
        env:
          GENESISDB_URL: http://localhost:8080
          GENESISDB_AUTH_TOKEN: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
